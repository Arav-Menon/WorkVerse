name: Production Deployment

on:
  push:
    branches:
      - deployment

concurrency:
  group: prod-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: docker.io
  DOCKERHUB_USERNAME: aravmenon12
  STAGING_OPS_REPO: arav-menon/staging-ops
  STAGING_OPS_BRANCH: deployment

jobs:
  detect-changes:
    name: Detect Affected Services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changes
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: .github/scripts/detect-changes.sh

  build-and-push:
    name: Build & Push ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build & Push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/workverse-${{ matrix.service }}:latest
            ${{ env.DOCKERHUB_USERNAME }}/workverse-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          labels: |
            org.opencontainers.image.title=workverse-${{ matrix.service }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify Image Pushed
        run: echo "Pushed ${{ env.DOCKERHUB_USERNAME }}/workverse-${{ matrix.service }}:${{ github.sha }}"

  update-staging-ops:
    name: Update staging-ops Helm Charts
    needs: [detect-changes, build-and-push]
    if: always() && needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout WorkVerse
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install yq
        uses: dcarbone/install-yq-action@v1.0.1

      - name: Clone staging-ops
        run: |
          git clone "https://x-access-token:${{ secrets.STAGING_OPS_PAT }}@github.com/${{ env.STAGING_OPS_REPO }}.git" staging-ops
          cd staging-ops
          git checkout ${{ env.STAGING_OPS_BRANCH }} 2>/dev/null || git checkout -b ${{ env.STAGING_OPS_BRANCH }}
          echo "Branch: $(git branch --show-current)"

      - name: Validate & Update Helm Values
        env:
          MATRIX_JSON: ${{ needs.detect-changes.outputs.matrix }}
        run: |
          cd staging-ops
          NEW_TAG="${{ github.sha }}"
          echo "Image tag: $NEW_TAG"
          echo ""

          FAILED=0

          echo "${MATRIX_JSON}" | jq -c '.[]' | while read -r item; do
            SVC=$(echo "$item" | jq -r '.service')
            FILE="prod/workverse/${SVC}/values.yaml"

            if [ ! -f "$FILE" ]; then
              echo "ERROR: Helm values.yaml not found: $FILE"
              echo "  -> Service '${SVC}' has no Helm chart in staging-ops."
              echo "  -> Create prod/workverse/${SVC}/values.yaml before deploying."
              FAILED=1
              continue
            fi

            CURRENT_TAG=$(yq eval '.image.tag // ""' "$FILE" 2>/dev/null)
            if [ -z "$CURRENT_TAG" ] || [ "$CURRENT_TAG" = "null" ]; then
              echo "ERROR: No image.tag field in $FILE"
              echo "  -> The values.yaml must have an 'image.tag' field."
              echo "  -> Expected structure: image: { repository: ..., tag: ... }"
              FAILED=1
              continue
            fi

            yq eval ".image.tag = \"${NEW_TAG}\"" -i "$FILE"

            ACTUAL_TAG=$(yq eval '.image.tag' "$FILE")
            if [ "$ACTUAL_TAG" != "$NEW_TAG" ]; then
              echo "ERROR: Failed to update image.tag in $FILE"
              echo "  -> Expected: $NEW_TAG"
              echo "  -> Got: $ACTUAL_TAG"
              FAILED=1
              continue
            fi

            echo "UPDATE: $FILE → tag: $ACTUAL_TAG"
          done

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "ERROR: Helm chart validation failed. Aborting push."
            echo "  -> Fix the issues above and retry."
            exit 1
          fi

      - name: Commit & Push
        env:
          MATRIX_JSON: ${{ needs.detect-changes.outputs.matrix }}
        run: |
          cd staging-ops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          TAG="${{ github.sha }}"
          SERVICES=$(echo "${MATRIX_JSON}" | jq -r '.[].service' | paste -sd,)
          IMAGES=$(echo "${MATRIX_JSON}" | jq -r '.[].service' | sed 's/^/  - workverse-/' | sed "s/$/:${TAG}/")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          git commit -m "chore(deploy): update images for ${TAG}" \
            -m "Services:" \
            -m "${IMAGES}" \
            -m "Workflow: ${RUN_URL}"

          git push origin ${{ env.STAGING_OPS_BRANCH }}
          echo "Pushed to staging-ops"

  summary:
    name: Deployment Summary
    needs: [detect-changes, build-and-push, update-staging-ops]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Build Summary
        env:
          MATRIX_JSON: ${{ needs.detect-changes.outputs.matrix }}
          HAS_CHANGES: ${{ needs.detect-changes.outputs.has_changes }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          DEPLOY_RESULT: ${{ needs.update-staging-ops.result }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DOCKER_USER: ${{ env.DOCKERHUB_USERNAME }}
        run: |
          echo "## Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${COMMIT_SHA}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${BRANCH}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Actor** | \`${ACTOR}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Workflow** | [Run ${RUN_ID}](${RUN_URL}) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${HAS_CHANGES}" == "true" ]; then
            echo "### Affected Services" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            echo "${MATRIX_JSON}" | jq '.' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "### Pipeline Results" >> $GITHUB_STEP_SUMMARY
            echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| Detect Changes | ✅ Success |" >> $GITHUB_STEP_SUMMARY
            if [ "${BUILD_RESULT}" == "success" ]; then
              echo "| Build & Push | ✅ Success |" >> $GITHUB_STEP_SUMMARY
            elif [ "${BUILD_RESULT}" == "failure" ]; then
              echo "| Build & Push | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Build & Push | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
            fi
            if [ "${DEPLOY_RESULT}" == "success" ]; then
              echo "| Update staging-ops | ✅ Success |" >> $GITHUB_STEP_SUMMARY
            elif [ "${DEPLOY_RESULT}" == "failure" ]; then
              echo "| Update staging-ops | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| Update staging-ops | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "### Docker Images" >> $GITHUB_STEP_SUMMARY
            echo "${MATRIX_JSON}" | jq -r '.[].service' | while read -r svc; do
              echo "- \`${DOCKER_USER}/workverse-${svc}:${COMMIT_SHA}\`" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "No services were affected by this push." >> $GITHUB_STEP_SUMMARY
          fi
