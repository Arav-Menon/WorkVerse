upstream backend {
    server backend:5000;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

server {
    listen 80;
    server_name workverse.arav.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }

}

server {
    listen 443 ssl;
    server_name workverse.arav.space;

    ssl_certificate /etc/letsencrypt/live/workverse.arav.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workverse.arav.space/privkey.pem;

    limit_req_status 429;

    error_page 429 = @too_many_requests;

}  

    location /api/ {
        limit_req zone=api_limit burst=10;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location @too_many_requests {
        default_type application/json;
        return 429 '{ "message": "Too many requests. Please try again later." }';
    }
}